plugins() {
    id("java-library")

    id("checkstyle")

    id("signing")
    id("maven-publish")
}

this.group = "net.elytrium"
this.version = "1.2.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

repositories() {
    mavenCentral()
}

dependencies() {
    compileOnly("org.jetbrains:annotations:26.1.0")

    testImplementation("it.unimi.dsi:fastutil-core:8.5.12")
    testImplementation("org.yaml:snakeyaml:2.7")
    testImplementation("com.fasterxml.jackson.core:jackson-core:2.22.0")

    testImplementation("org.junit.jupiter:junit-jupiter-api:$junitVersion")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:$junitVersion")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:$junitVersion")
}

test() {
    useJUnitPlatform()
}

checkstyle() {
    toolVersion = "10.12.1"

    configFile = file("$rootDir/.config/checkstyle/checkstyle.xml")
    configProperties = ["configDirectory": "$rootDir/.config/checkstyle"]
    maxErrors = 0
    maxWarnings = 0
}

javadoc() {
    options.setEncoding("UTF-8")
    options.setSource("21")
    options.links("https://docs.oracle.com/en/java/javase/21/docs/api/")
    options.addStringOption("Xdoclint:none", "-quiet")
}

publishing() {
    repositories() {
        maven() {
            credentials() {
                username = System.getenv("ELYTRIUM_MAVEN_USERNAME")
                password = System.getenv("ELYTRIUM_MAVEN_PASSWORD")
            }

            name = "elytrium-repo"
            url = "https://maven.elytrium.net/repo/"
        }

        maven() {
            credentials() {
                username = System.getenv("ELYTRIUM_OSSRH_USERNAME")
                password = System.getenv("ELYTRIUM_OSSRH_PASSWORD")
            }

            name = "ossrh-repo"
            url = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
        }
    }

    publications.create("publication", MavenPublication) {
        pom() {
            name = "Elytrium Java Serializer"
            description = "Java Library to (de-)serialize data in various formats (e.g. JSON, YAML)"
            url = "https://github.com/Elytrium/java-serializer"
            licenses() {
                license() {
                    name = "GNU Lesser General Public License v3.0"
                    url = "https://www.gnu.org/licenses/lgpl-3.0.en.html"
                }
            }
            developers() {
                developer() {
                    id = "hevav"
                    name = "Petr Ilin"
                    email = "p.ilin@elytrium.net"
                }
            }
            scm() {
                connection = "scm:git:git://github.com/Elytrium/java-serializer.git"
                developerConnection = "scm:git:ssh://github.com/Elytrium/java-serializer.git"
                url = "https://github.com/Elytrium/java-serializer"
            }
        }

        from(components.java)
    }
}

signing() {
    if (rootProject.hasProperty("signing.keyId")) {
        sign(publishing.publications.publication)
    }
}

// Transfer a completed Maven upload to the Portal for manual review and release.
tasks.register("stageCentralPublication") {
    group = "publishing"
    description = "Upload the publication and transfer it to Central Portal without releasing it."
    dependsOn("publishPublicationPublicationToOssrh-repoRepository")
    doLast {
        def username = System.getenv("ELYTRIUM_OSSRH_USERNAME")
        def password = System.getenv("ELYTRIUM_OSSRH_PASSWORD")
        if (!username || !password) {
            throw new GradleException("Central Portal token credentials are required in ELYTRIUM_OSSRH_USERNAME/PASSWORD")
        }
        def namespace = providers.gradleProperty("centralNamespace").getOrElse(project.group.toString())
        def encodedNamespace = java.net.URLEncoder.encode(namespace, java.nio.charset.StandardCharsets.UTF_8)
        def token = java.util.Base64.encoder.encodeToString("${username}:${password}".getBytes(java.nio.charset.StandardCharsets.UTF_8))
        def request = java.net.http.HttpRequest.newBuilder()
            .uri(java.net.URI.create("https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${encodedNamespace}?publishing_type=user_managed"))
            .timeout(java.time.Duration.ofMinutes(2))
            .header("Authorization", "Bearer " + token)
            .POST(java.net.http.HttpRequest.BodyPublishers.noBody())
            .build()
        def response = java.net.http.HttpClient.newHttpClient().send(request, java.net.http.HttpResponse.BodyHandlers.discarding())
        if (response.statusCode() < 200 || response.statusCode() >= 300) {
            throw new GradleException("Central Portal transfer failed with HTTP " + response.statusCode())
        }
        logger.lifecycle("Publication transferred to https://central.sonatype.com/publishing for manual review and release.")
    }
}
